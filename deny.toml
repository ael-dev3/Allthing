# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Dependency license policy: everything Allthing links must be compatible
# with distribution under AGPL-3.0-or-later. Run `cargo deny check licenses`.

[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = false

[licenses]
# The licenses in use today, all compatible with the (A)GPL v3. Others that
# would be fine to add if a dependency needs them: BSD-2-Clause, ISC, MIT-0,
# MPL-2.0, Apache-2.0 WITH LLVM-exception. Never add proprietary or
# GPL-incompatible licenses (e.g. SSPL, BUSL, CC-BY-NC, EPL-1.0).
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
