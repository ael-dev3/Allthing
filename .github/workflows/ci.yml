# SPDX-License-Identifier: AGPL-3.0-or-later
#
# `check`, on pushes and pull requests: formatting, Clippy
# (native and wasm32), unit tests and the dependency license audit. `perf`,
# on pushes to main: the performance budget against the live site.
# `browser`: deterministic fixture regressions against the local build.
# Cloudflare Workers Builds deploys the site, so nothing here deploys; the
# full live-data suite runs locally or against https://allthing.social.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: sh scripts/check.sh

  perf:
    # The performance budget (docs/PERFORMANCE.md), checked against the live
    # site after each push to main. Workers Builds deploys in parallel, so this
    # measures the release being replaced or the new one, whichever is live.
    name: performance budget (allthing.social)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/perf.spec.ts
        env:
          E2E_BASE_URL: https://allthing.social

  browser:
    name: browser regressions (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_LABELS: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            target/tools
            ~/.cache/worker-build
          key: browser-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:tools
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/build.sh
      - name: Test the local build without live data
        run: npx playwright test '\.fixture\.spec\.ts$'
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-fixtures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
