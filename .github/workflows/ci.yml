# SPDX-License-Identifier: AGPL-3.0-or-later
#
# `check`, on pushes and pull requests: formatting, Clippy
# (native and wasm32), unit tests and the dependency license audit. `perf`,
# on pushes to main: the performance budget against the live site.
# `browser`: deterministic fixture regressions against the local build.
# `speed`, on manual runs only: the speed report's load times at 1280 and
# 390 px on the live site, for before/after numbers.
# Cloudflare Workers Builds deploys the site, so nothing here deploys; the
# full live-data suite runs locally or against https://allthing.social.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: sh scripts/check.sh

  perf:
    # The performance budget (docs/PERFORMANCE.md), checked against the live
    # site after Workers Builds deploys the checked-out main commit.
    name: performance budget (allthing.social)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Up to 30 minutes waiting for the deploy (scripts/wait-for-deploy.mjs),
    # then the measurements.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # A manual run measures production main, even when dispatched from another ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          # The history the deploy wait needs to tell whether a later live
          # commit includes this one.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the intended deployment
        run: node scripts/wait-for-deploy.mjs https://allthing.social "$(git rev-parse HEAD)"
      - run: npx playwright test e2e/perf.spec.ts
        env:
          E2E_BASE_URL: https://allthing.social

  speed:
    # The speed report (docs/PERFORMANCE.md#speed-report): load times of the
    # front page on the live site as deployed, at 1280 and 390 px under fixed
    # network and CPU profiles. It reports numbers and fails only if the page
    # doesn't load.
    name: speed report (allthing.social)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/speed-report.spec.ts
        env:
          E2E_BASE_URL: https://allthing.social
          E2E_SPEED: "1"

  browser:
    name: browser regressions (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            target/tools
            ~/.cache/worker-build
          key: browser-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:tools
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/build.sh
      - name: Test the local build without live data
        run: npx playwright test '\.fixture\.spec\.ts$'
      - name: Test static payloads
        run: |
          bash scripts/build-pages.sh
          E2E_PAGES=1 npx playwright test e2e/static-body-limit.fixture.spec.ts e2e/static-metadata.fixture.spec.ts
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-fixtures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
