# SPDX-License-Identifier: AGPL-3.0-or-later
#
# One cheap job on pushes and pull requests: formatting, Clippy (native and
# wasm32), unit tests and the dependency license audit. Cloudflare Workers
# Builds deploys the site, so nothing here deploys; the end-to-end suite runs
# locally or against https://allthing.social (docs/DEPLOY.md).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: sh scripts/check.sh
