name: pages

# Publishes the static export to GitHub Pages on every push to main, then
# runs the end-to-end tests against the live site. Pages serves the gh-pages
# branch, which this workflow replaces on each deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static export
        run: npm run build:static
        env:
          ALLTHING_BASE_PATH: /${{ github.event.repository.name }}
      - name: Stamp the build
        run: |
          echo "$GITHUB_SHA" > out/build.txt
          touch out/.nojekyll
      - name: Publish to the gh-pages branch
        working-directory: out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy $GITHUB_SHA"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - id: site
        run: echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

  verify:
    name: end-to-end against the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to serve this commit
        env:
          SITE: ${{ needs.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 60); do
            served=$(curl -fsS "${SITE}build.txt?check=${attempt}-$(date +%s)" || true)
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "live after ${attempt} checks"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not serve ${GITHUB_SHA} within 10 minutes" >&2
          exit 1
      - run: npm run test:e2e
        env:
          E2E_STATIC: "1"
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
          E2E_SCREENSHOT_DIR: test-results/live-screenshots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-site-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
