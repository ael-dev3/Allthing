<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f4ee">
<title>Allthing</title>
<meta name="description" content="Allthing is a quiet Farcaster client, made for reading: trending casts, channels and threads, with honest engagement, inline media and visible provenance.">
<meta property="og:title" content="Allthing">
<meta property="og:description" content="A quiet window onto Farcaster, made for reading.">
<meta property="og:type" content="website">
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<!-- Starts the page's data request (front page, post, profile, its followers or following, or channel) while the app downloads; api.rs takes it over when the app asks for the same path. Its hash is in _headers (checked by scripts/check.sh). -->
<script id="early-fetch">(function(){var l=location.pathname,m,p;if(location.hostname==="www.allthing.social")return;if(l==="/"){var q=new URLSearchParams(location.search),t=q.get("t"),w=t==="hour"?"1h":t==="6h"?"6h":t==="12h"?"12h":t==="week"?"7d":t==="month"?"30d":t==="year"?"365d":t==="all"?"all":"";p=/(?:^|;\s*)__Host-allthing-user=/.test(document.cookie)&&q.get("feed")==="following"?"/api/v1/following":q.get("sort")==="new"?"/api/v1/latest":"/api/v1/home"+(w?"?window="+w:"")}else if(m=/^\/p\/(?:0x)?([0-9a-f]{40})$/i.exec(l))p="/api/v1/cast?hash=0x"+m[1].toLowerCase();else if(m=/^\/u\/@?([a-z0-9][a-z0-9._-]{0,63})$/i.exec(l))p="/api/v1/user?name="+m[1].toLowerCase();else if(m=/^\/u\/@?([a-z0-9][a-z0-9._-]{0,63})\/(followers|following)$/i.exec(l))p="/api/v1/follows?name="+m[1].toLowerCase()+"&dir="+m[2].toLowerCase();else if(m=/^\/c\/([a-z0-9][a-z0-9-]{0,63})$/i.exec(l))p="/api/v1/channel?id="+m[1].toLowerCase();else if(l==="/dau")p="/api/v1/activity";if(p)window.__allthingEarly={path:p,response:fetch(p)}})()</script>
<!-- A visit that starts on a page whose code is a part of its own (a post, a profile, its followers or following, a channel, search, the channels, the reader's notifications: crate::split) starts fetching that code here, with the app. Its hash is in _headers (checked by scripts/check.sh). -->
<meta name="allthing-parts" content="{{PAGE_PARTS}}">
<script id="early-parts">(function(){var l=location.pathname,k=/^\/p\//.test(l)?"post":/^\/u\/[^/]+\/follow(?:ers|ing)$/.test(l)?"follows":/^\/u\//.test(l)?"user":/^\/c\//.test(l)?"channel":l==="/search"?"search":l==="/channels"?"channels":l==="/notifications"?"notifications":l==="/library"?"library":"",m=document.querySelector('meta[name="allthing-parts"]'),f=[];try{f=k&&m?JSON.parse(m.content)[k]||[]:[]}catch(e){}f.forEach(function(u){var n=document.createElement("link");n.rel="preload";n.as="fetch";n.crossOrigin="anonymous";n.href=u;document.head.appendChild(n)})})()</script>
<link rel="preconnect" href="https://imagedelivery.net">
<!-- The connection images' sizes are asked for on (media.rs, `size_up`; paint.js): a CORS request's own. -->
<link rel="preconnect" href="https://imagedelivery.net" crossorigin>
<link rel="preconnect" href="https://stream.farcaster.xyz" crossorigin>
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"href_matches":"/p/*"},"eagerness":"moderate"}]}</script>
<link rel="preload" href="{{BASE}}/assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{WASM}}" as="fetch" type="application/wasm" crossorigin>
<link rel="modulepreload" href="{{JS}}">
<link rel="modulepreload" href="{{SPLIT_JS}}">
<link rel="stylesheet" href="{{CSS}}">
<!-- Draws the front page's first cards from the early fetch while the app downloads; the app takes over (not in the static copy). -->
{{PAINT}}
<!-- A pinned, pre-Wasm guard can recover the entry script itself once, only after a confirmed same-origin 404/410. Successful loads add no requests. -->
<script id="entry-recovery">(function(){
  var retried=false;
  function stop(){document.removeEventListener("error",failed,true);document.removeEventListener("load",loaded,true)}
  function loaded(event){if(event.target===document.getElementById("allthing-boot"))stop()}
  function panel(){
    var root=document.getElementById("app"),boot=document.getElementById("boot");
    if(!root){document.addEventListener("DOMContentLoaded",panel,{once:true});return}
    if(boot){boot.querySelector(".boot-glow")?.remove();boot.querySelector("main")?.remove();boot.removeAttribute("data-painted");boot.removeAttribute("aria-hidden")}
    var main=document.createElement("main"),box=document.createElement("section"),title=document.createElement("h1"),message=document.createElement("p"),reload=document.createElement("button");
    main.id="main";main.className="page";box.className="error-panel";box.setAttribute("role","alert");title.textContent="Allthing couldn’t load";message.textContent="Reload to try again.";reload.type="button";reload.className="button";reload.textContent="Reload";reload.addEventListener("click",function(){location.reload()});box.append(title,message,reload);main.append(box);root.replaceChildren(main);if(document.activeElement===document.body)reload.focus()
  }
  function failed(event){
    var entry=document.getElementById("allthing-boot");if(!entry||event.target!==entry)return;
    var url=new URL(entry.src,location.href),timing=performance.getEntriesByName(url.href,"resource"),status=timing.length?timing[timing.length-1].responseStatus:0;
    if(!retried&&url.origin===location.origin&&(status===404||status===410)){
      retried=true;url.searchParams.set("__allthing_entry_retry","1");var next=document.createElement("script");next.type="module";next.src=url.href;next.id="allthing-boot";entry.replaceWith(next)
    }else{stop();panel()}
  }
  document.addEventListener("error",failed,true);document.addEventListener("load",loaded,true)
})()</script>
<script type="module" src="{{BOOT}}" id="allthing-boot"></script>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true">
  <!-- The app's header as it will be, so nothing in it pops in when the app comes: navigation, the search box, and the account's place, which boot.js fills (Sign in, the reader's picture, or the static copy's note). Classes of their own (boot-*), styled as the app's, so nothing that looks for the app's finds these. -->
  <header class="site-header"><div class="header-inner"><span class="wordmark">Allthing</span><nav class="boot-nav"><span data-route="/">Home</span><span class="library-nav" data-route="/library">Library</span><span class="dau-nav" data-route="/dau">DAU</span></nav><form class="boot-search"><svg class="icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg><input type="search" placeholder="Search" tabindex="-1" disabled></form><span id="boot-account"></span></div><div class="portal-line"></div></header>
  <div class="boot-glow"></div>
</div>
<noscript><p class="noscript">Allthing is built in Rust and runs as WebAssembly, so it needs JavaScript enabled.</p></noscript>
<div id="app"></div>
</body>
</html>
