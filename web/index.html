<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f4ee">
<title>Allthing</title>
<meta name="description" content="Allthing is a quiet Farcaster client, made for reading: trending casts, channels and threads, with honest engagement, inline media and visible provenance.">
<meta property="og:title" content="Allthing">
<meta property="og:description" content="A quiet window onto Farcaster, made for reading.">
<meta property="og:type" content="website">
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<!-- Starts the page's data request (front page, post, profile or channel) while the app downloads; api.rs takes it over when the app asks for the same path. Its hash is in _headers (checked by scripts/check.sh). -->
<script id="early-fetch">(function(){var l=location.pathname,m,p;if(location.hostname==="www.allthing.social")return;if(l==="/"){var q=new URLSearchParams(location.search),t=q.get("t"),w=t==="hour"?"1h":t==="week"?"7d":t==="month"?"30d":t==="year"?"365d":t==="all"?"all":"";p=q.get("sort")==="new"?"/api/v1/latest":"/api/v1/home"+(w?"?window="+w:"")}else if(m=/^\/p\/(?:0x)?([0-9a-f]{40})$/i.exec(l))p="/api/v1/cast?hash=0x"+m[1].toLowerCase();else if(m=/^\/u\/@?([a-z0-9][a-z0-9._-]{0,63})$/i.exec(l))p="/api/v1/user?name="+m[1].toLowerCase();else if(m=/^\/c\/([a-z0-9][a-z0-9-]{0,63})$/i.exec(l))p="/api/v1/channel?id="+m[1].toLowerCase();else if(l==="/dau")p="/api/v1/activity";if(p)window.__allthingEarly={path:p,response:fetch(p)}})()</script>
<!-- A visit that starts on a page whose code is a part of its own (a post, a profile, a channel, search, the channels: crate::split) starts fetching that code here, with the app. Its hash is in _headers (checked by scripts/check.sh). -->
<meta name="allthing-parts" content="{{PAGE_PARTS}}">
<script id="early-parts">(function(){var l=location.pathname,k=/^\/p\//.test(l)?"post":/^\/u\//.test(l)?"user":/^\/c\//.test(l)?"channel":l==="/search"?"search":l==="/channels"?"channels":"",m=document.querySelector('meta[name="allthing-parts"]'),f=[];try{f=k&&m?JSON.parse(m.content)[k]||[]:[]}catch(e){}f.forEach(function(u){var n=document.createElement("link");n.rel="preload";n.as="fetch";n.crossOrigin="anonymous";n.href=u;document.head.appendChild(n)})})()</script>
<link rel="preconnect" href="https://imagedelivery.net">
<link rel="preconnect" href="https://stream.farcaster.xyz" crossorigin>
<script type="speculationrules">{"prefetch":[{"source":"document","where":{"href_matches":"/p/*"},"eagerness":"moderate"}]}</script>
<link rel="preload" href="{{BASE}}/assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{WASM}}" as="fetch" type="application/wasm" crossorigin>
<link rel="modulepreload" href="{{JS}}">
<link rel="modulepreload" href="{{SPLIT_JS}}">
<link rel="stylesheet" href="{{CSS}}">
<!-- Draws the front page's first cards from the early fetch while the app downloads; the app takes over (not in the static copy). -->
{{PAINT}}
<script type="module" src="{{BOOT}}"></script>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true">
  <!-- The app's header, as tall as it is: its search box sets its height, so an unseen one is here too. -->
  <header class="site-header"><div class="header-inner"><span class="wordmark">Allthing</span><form class="search-box boot-holder"><input type="search" tabindex="-1" disabled></form></div><div class="portal-line"></div></header>
  <div class="boot-glow"></div>
</div>
<noscript><p class="noscript">Allthing is built in Rust and runs as WebAssembly, so it needs JavaScript enabled.</p></noscript>
<div id="app"></div>
</body>
</html>
