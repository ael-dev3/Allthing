<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f4ee">
<title>Allthing</title>
<meta name="description" content="Allthing is a quiet, read-only Farcaster client: trending casts, channels and threads, with honest engagement, inline media and visible provenance.">
<meta property="og:title" content="Allthing">
<meta property="og:description" content="A quiet, read-only window onto Farcaster.">
<meta property="og:type" content="website">
<link rel="icon" href="{{BASE}}/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{BASE}}/assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{WASM}}" as="fetch" type="application/wasm" crossorigin>
<link rel="modulepreload" href="{{JS}}">
<link rel="stylesheet" href="{{CSS}}">
<script type="module" src="{{BOOT}}"></script>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true">
  <header class="site-header"><div class="header-inner"><span class="wordmark">Allthing</span></div><div class="portal-line"></div></header>
  <div class="boot-glow"></div>
</div>
<noscript><p class="noscript">Allthing is built in Rust and runs as WebAssembly, so it needs JavaScript enabled.</p></noscript>
<div id="app"></div>
</body>
</html>
