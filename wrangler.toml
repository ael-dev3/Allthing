#
# Allthing on Cloudflare Workers (Free plan). Deployed by Workers Builds from
# this repository; no API token lives here. See docs/DEPLOY.md and
# docs/BUDGET.md.

name = "allthing"
account_id = "c647739b4535010b0b13e6fc296e2c4e"
main = "crates/allthing-worker/build/index.js"
compatibility_date = "2026-09-01"

# allthing.social serves the app; www.allthing.social redirects to it.
routes = [
  { pattern = "allthing.social", custom_domain = true },
  { pattern = "www.allthing.social", custom_domain = true },
]

# The browser app, its styles and fonts, built by scripts/build.sh.
# Requests for assets are free and never invoke the Worker; unknown paths
# get index.html (client-side routing). /api/* runs the Worker, and so does
# /wasm/*: the app's WebAssembly, served compressed at brotli's highest
# level from the copy the build writes (ASSETS reads it); and /m/*:
# readers' attachments, from R2 (below).
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/version", "/wasm/*", "/m/*"]

# Per-client backstop so one client cannot drain the 100k requests/day
# allowance: 120 API calls a minute per IP, per Cloudflare location.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Allthing's index of notable casts, which ranks Past month, Past year and
# All time. The cron job below fills it; migrations/ holds its schema, which
# the Worker also creates itself. See docs/ARCHITECTURE.md and docs/BUDGET.md.
[[d1_databases]]
binding = "INDEX"
database_name = "allthing-index"
database_id = "184a345b-13ba-4db9-b1a6-4ea3a9c60f8c"
migrations_dir = "migrations"

# Readers' attachments: the images and videos they add to their casts, kept
# in the R2 bucket allthing-media and served by the Worker at /m/ (see
# docs/ARCHITECTURE.md#attachments; the bucket's setup is in
# docs/DEPLOY.md#attachments-r2). `wrangler deploy` fails if the bucket is
# missing. `wrangler dev` keeps the files in a local R2 beside D1. Without
# this binding, uploads and /m/ answer 404 and /api/v1/status says
# `media.ready: false`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "allthing-media"

# Every minute, each in an invocation of its own: the indexer (one page of
# casts), and the stored copy of the newest casts that a data center with
# none of its own serves ("*/1", so the Worker can tell the two apart).
[triggers]
crons = ["* * * * *", "*/1 * * * *", "*/2 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.05

# The Farcaster account Allthing asks for readers' keys as, the app their
# casts show as "via Allthing": its own, @allthingapp. Public. Writing from
# Allthing also needs that account's custody key, the ALLTHING_CUSTODY_KEY
# secret, set in Cloudflare only (docs/DEPLOY.md#secrets); until it is set,
# writes go to the Farcaster app.
[vars]
ALLTHING_FID = "3356318"
