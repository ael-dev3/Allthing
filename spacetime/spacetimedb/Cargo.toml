[package]
name = "allthing_spacetime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.13.*" }
log = "0.4"
# verify_fid: Allthing's attestation (Ed25519), checked in the module.
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
