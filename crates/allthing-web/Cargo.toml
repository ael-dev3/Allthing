# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "allthing-web"
description = "Allthing's browser app: Leptos components compiled to WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Build each page's payload in the browser instead of calling the Worker's
# /api/v1, for static hosting such as GitHub Pages (see scripts/build-pages.sh).
static-host = ["dep:allthing-data", "dep:futures"]

[dependencies]
allthing-core.workspace = true
allthing-data = { workspace = true, optional = true }
console_error_panic_hook.workspace = true
futures = { workspace = true, optional = true }
js-sys.workspace = true
leptos.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
send_wrapper.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dependencies.web-sys]
workspace = true
features = [
    "AbortController",
    "AbortSignal",
    "AddEventListenerOptions",
    "Blob",
    "BlobPropertyBag",
    "BroadcastChannel",
    "CssStyleDeclaration",
    "CompositionEvent",
    "ClipboardEvent",
    "Document",
    "DomMatrixReadOnly",
    "DomRect",
    "DomTokenList",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaSource",
    "MediaSourceReadyState",
    "MessageEvent",
    "MouseEvent",
    "NodeList",
    "Navigator",
    "PointerEvent",
    "ProgressEvent",
    "Request",
    "Selection",
    "History",
    "ScrollRestoration",
    "RequestCache",
    "RequestInit",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Response",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "SourceBuffer",
    "SourceBufferAppendMode",
    "Storage",
    "TimeRanges",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Url",
    "UrlSearchParams",
    "Window",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestUpload",
    "Text",
    "Range",
    "InputEvent",
    "DragEvent",
    "DataTransfer",
    "Crypto",
    "CryptoKey",
    "CryptoKeyPair",
    "SubtleCrypto",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
]
