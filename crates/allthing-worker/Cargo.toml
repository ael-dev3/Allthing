# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "allthing-worker"
description = "Allthing's Cloudflare Worker: a cached, rate-guarded read API over Hypersnap and public chain RPCs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
allthing-core.workspace = true
allthing-data.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
worker = { workspace = true, features = ["d1"] }
# Sign In With Farcaster (src/auth.rs), in the Worker only, never in the
# browser app: the signer of a signed-in message (secp256k1 recovery and
# Keccak-256), the session cookie's HMAC, and the sign-in QR code.
hmac = "0.13"
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
qrcode = { version = "0.14", default-features = false }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.12", default-features = false }
