<title>Allthing has moved to allthing.social</title>
<link rel="canonical" href="https://allthing.social/">
<script>
  // Keep the path and query: /Allthing/u/?name=dwr → https://allthing.social/u/?name=dwr
  var path = location.pathname.replace(/^\/allthing(?=\/|$)/i, "") || "/";
  location.replace("https://allthing.social" + path + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://allthing.social/"></noscript>
