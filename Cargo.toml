# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = [
    "crates/allthing-core",
    "crates/allthing-data",
    "crates/allthing-web",
    "crates/allthing-worker",
    "xtask",
]
# The SpacetimeDB module builds on its own (spacetime/README.md).
exclude = ["spacetime/spacetimedb"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ael-dev3/Allthing"
homepage = "https://allthing.social"
authors = ["Allthing contributors"]

[workspace.dependencies]
allthing-core = { path = "crates/allthing-core" }
allthing-data = { path = "crates/allthing-data" }
console_error_panic_hook = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
worker = "0.8"

# Both WebAssembly targets ship over the network: optimize for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.release.package.xtask]
opt-level = 2
