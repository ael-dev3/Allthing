[workspace]
members = ["crates/allthing-core", "crates/allthing-web", "crates/allthing-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ael-dev3/Allthing"
authors = ["Allthing contributors"]

[workspace.dependencies]
allthing-core = { path = "crates/allthing-core" }
allthing-web = { path = "crates/allthing-web", default-features = false }
axum = "0.8"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

[[workspace.metadata.leptos]]
name = "allthing"
bin-package = "allthing-server"
lib-package = "allthing-web"
output-name = "allthing"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/allthing.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
